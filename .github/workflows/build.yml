name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Llave de firma
        run: cp keystore/release.jks app/release.jks

      - name: Compilar APK firmado
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Renombrar
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/Kiko-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kiko
          path: salida/*

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-b${{ github.run_number }}
          name: Kiko 1.0.0
          body: |
            Aventura de Kiko, juego de plataformas para tele Android (TCL/Google TV) y móvil.
            Se juega con mando Bluetooth, con el control remoto o con los botones en pantalla.
            Descarga el archivo .apk e instálalo (permite "orígenes desconocidos").
          files: salida/*
          make_latest: true
