name: Compilar Bolita al Centro

on:
  push:
    branches: [main]
    paths: ['bolita/**', '.github/workflows/bolita.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 36
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bolita/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Llave de firma
        run: cp keystore/release.jks bolita/app/release.jks

      - name: Compilar Bolita al Centro firmado
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p bolita :app:assembleRelease 2>&1 | tee build.log || { grep -E "error:|e: |What went wrong|^\* What|Execution failed|> " build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Renombrar
        run: |
          mkdir -p salida
          cp bolita/app/build/outputs/apk/release/app-release.apk salida/BolitaCentro.apk
          grep -o "versionName '[^']*'" bolita/app/build.gradle | cut -d"'" -f2 > salida/version.txt
          cat salida/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bolita
          path: salida/*

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bolita
          name: Bolita al Centro
          body: |
            Bolita al Centro: aguanta la bolita en el centro 3 segundos inclinando el teléfono.
            Descarga BolitaCentro.apk e instálalo en el teléfono.
          files: salida/*
          make_latest: false
