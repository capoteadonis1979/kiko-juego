name: Compilar Activador Capote Apps

on:
  push:
    branches: [main]
    paths: ['activador/**', '.github/workflows/activador.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 36
        run: |
          echo "sdk.dir=$ANDROID_HOME" > activador/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Llave de firma
        run: cp keystore/release.jks activador/app/release.jks

      - name: Compilar Activador Capote Apps firmado
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p activador :app:assembleRelease 2>&1 | tee build.log || { grep -E "error:|e: |What went wrong|^\* What|Execution failed|> " build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Renombrar
        run: |
          mkdir -p salida
          cp activador/app/build/outputs/apk/release/app-release.apk salida/ActivadorCapote.apk
          grep -o "versionName '[^']*'" activador/app/build.gradle | cut -d"'" -f2 > salida/version.txt
          cat salida/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: activador
          path: salida/*

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: activador
          name: Activador Capote Apps
          body: |
            Activador Capote Apps: app privada del vendedor (pide contraseña). No compartir.
            Solo para el dueño. No compartir.
          files: salida/*
          make_latest: false
