<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Voley Bolas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:"Fredoka";src:url(fredoka.woff2) format("woff2");font-weight:300 700;font-display:block}html,body{margin:0}</style>
<style>
:root{
  /* Layout: pantalla de juego centrada; en móvil vertical los mandos van debajo, en horizontal flotan encima */
  --bg:#06121c; --frame:#173246; --btn:#1d3a52; --btnOn:#2f5a7e; --fg:#eaf4fb; --a:#e8503e; --b:#f2b630;
  --pix:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  box-sizing:border-box;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
#g{display:block;background:#000;box-shadow:0 0 0 2px var(--frame);max-width:100%}
#ctl{display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box}
#ctl.land{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom,0px));pointer-events:none;padding:0 6px}
#ctl.port{padding:18px 4px 0}
#ctl>div{pointer-events:auto}
#dpad{display:flex;gap:10px}
.k{width:70px;height:70px;border-radius:14px;background:var(--btn);display:grid;place-items:center;font:15px var(--pix);color:var(--fg);border:2px solid #2c4c66;box-sizing:border-box}
.land .k{opacity:.45}
.k.on{background:var(--btnOn)}
#btns{display:flex;gap:14px;align-items:flex-end}
#bA,#bB{border-radius:50%}
#bA{background:var(--a);border-color:#8a2418;margin-bottom:26px}
#bB{background:var(--b);color:#3a2600;border-color:#8a6210}
#bA.on,#bB.on{filter:brightness(1.35)}
#pz{position:absolute;top:8px;right:0;width:46px;height:36px;border-radius:10px;background:var(--btn);color:var(--fg);border:2px solid #2c4c66;font:10px var(--pix);opacity:.75}
#pz:focus-visible{outline:2px solid var(--b)}
[hidden]{display:none!important}
#pad{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;gap:10px;font:11px var(--pix);color:var(--fg)}
#padtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#tilt{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
#tiltbar{display:flex;align-items:center;gap:10px;height:64px}
#tiltbar .tz{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--btn);border:2px solid #2c4c66;font-size:24px;flex:none}
#tiltbar .tz.on{background:#2fbf71;border-color:#1a7a44}
#tiltdot{flex:1;height:14px;border-radius:7px;background:#1d3a52;position:relative}
#tiltdot::after{content:"";position:absolute;top:-8px;left:calc(50% + var(--g,0) * 1%);width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#ffe070;box-shadow:0 0 0 3px #7a3a00}
#tap{flex:1;min-height:120px;border-radius:24px;background:var(--a);border:3px solid #8a2418;display:grid;place-items:center;font:700 22px var(--pix);color:#fff;text-align:center;touch-action:none;user-select:none}
#tap.on{filter:brightness(1.3)}
#tiltbtns{display:flex;gap:10px;align-items:center;justify-content:space-between}
#tiltbtns .pk{width:64px;height:56px;font-size:16px}
#tiltbtns button{font:700 13px var(--pix);background:#2f7fe0;color:#fff;border:2px solid #1c4c94;border-radius:12px;padding:14px 12px}
#padmode{background:#7a4ad0!important;border-color:#4a2a8a!important}
#padpair{background:#2f7fe0!important;border-color:#1c4c94!important}
#padtop button{font:10px var(--pix);background:var(--btn);color:var(--fg);border:2px solid #2c4c66;border-radius:10px;padding:10px 12px}
#padst{flex:1;min-width:0;line-height:1.6}
#padst.ok{color:#8aff6a} #padst.err{color:#ff9a8a}
.padman{display:flex;gap:8px;width:100%}
#padip{flex:1;min-width:0;font:14px var(--pix);padding:8px;border-radius:8px;border:2px solid #2c4c66;background:#0e2a3e;color:var(--fg)}
#padmain{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:0}
#cross{position:relative;width:min(48vh,46vw);height:min(48vh,46vw);flex:none}
.pk{display:grid;place-items:center;background:var(--btn);border:2px solid #2c4c66;border-radius:16px;font:18px var(--pix);color:var(--fg);touch-action:none;box-sizing:border-box}
.pk.on{background:var(--btnOn);transform:scale(.96)}
#cross .pk{position:absolute;width:34%;height:34%}
#cross .u{left:33%;top:0} #cross .d{left:33%;bottom:0} #cross .l{left:0;top:33%} #cross .r{right:0;top:33%}
.pk.st{font-size:10px;padding:14px 10px;align-self:flex-end}
#ab{display:flex;gap:18px;align-items:flex-end;flex:none}
#ab .pk{width:min(26vh,24vw);height:min(26vh,24vw);border-radius:50%;font-size:26px}
#ab .aa{background:var(--a);border-color:#8a2418;margin-bottom:min(14vh,10vw)}
#ab .bb{background:var(--b);color:#3a2600;border-color:#8a6210}
</style>
</head><body>

<div id="wrap">
  <canvas id="g" width="480" height="270" aria-label="Juego Voley Bolas"></canvas>
  <div id="ctl" hidden>
    <div id="dpad"><div class="k" id="kl">&#9664;</div><div class="k" id="kr">&#9654;</div></div>
    <div id="btns"><div class="k" id="bB">B</div><div class="k" id="bA">A</div></div>
  </div>
  <button id="pz" hidden aria-label="Pausa">II</button>
</div>
<div id="pad" hidden>
  <div id="padtop"><button id="padexit">SALIR</button><button id="padpair">EMPAREJAR</button><button id="padmode">BOTONES</button><span id="padst">Buscando la tele...</span><div class="padman" hidden><input id="padip" inputmode="decimal" placeholder="192.168.1.20" aria-label="Direccion de la tele"><button id="padgo">CONECTAR</button></div></div>
  <div id="tilt">
    <div id="tiltbar"><div class="tz" id="tzl">&#9664;</div><div id="tiltdot"></div><div class="tz" id="tzr">&#9654;</div></div>
    <div id="tap" data-k="a">TOCA PARA SALTAR</div>
    <div id="tiltbtns"><div data-k="up" class="pk">&#9650;</div><div data-k="down" class="pk">&#9660;</div><button id="tiltzero">CENTRAR</button><div data-k="start" class="pk">START</div></div>
  </div>
  <div id="padmain" hidden>
    <div id="cross"><div data-k="up" class="pk u">&#9650;</div><div data-k="left" class="pk l">&#9664;</div><div data-k="right" class="pk r">&#9654;</div><div data-k="down" class="pk d">&#9660;</div></div>
    <div data-k="start" class="pk st">START</div>
    <div id="ab"><div data-k="b" class="pk bb">B</div><div data-k="a" class="pk aa">A</div></div>
  </div>
</div>
<script>
(()=>{
const VERSION='v1.12.1';
const VW=480, VH=270, GY=236, NX=240, NT=150, GRAV=0.105;
const cv=document.getElementById('g'), ctx=cv.getContext('2d');
let SC=1;
const FONT='"Fredoka", "Trebuchet MS", system-ui, sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pad=(n,l)=>String(Math.max(0,n)).padStart(l,'0');

/* ================= SONIDO ================= */
let AC=null, master, mus, sfx, noiseBuf;
function initAudio(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      AC=new C(); master=AC.createGain(); master.gain.value=0.6; master.connect(AC.destination);
      mus=AC.createGain(); mus.gain.value=0.16; mus.connect(master);
      sfx=AC.createGain(); sfx.gain.value=0.5; sfx.connect(master);
      noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.3),AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended') AC.resume();
  }catch(e){ AC=null; }
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,type,out,when,vol,f2){
  if(!AC) return; const t=when||AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type;
  o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol){ if(!AC) return; const t=AC.currentTime; const s=AC.createBufferSource(); s.buffer=noiseBuf; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); s.connect(g); g.connect(sfx); s.start(t); s.stop(t+dur); }
function seq(notes,step,type,vol){ if(!AC) return; let t=AC.currentTime; for(const n of notes){ if(n) tone(mtof(n),step*0.95,type,sfx,t,vol); t+=step; } }
const S={
  bump:()=>{ noise(0.05,0.9); tone(780,0.13,'sine',sfx,0,1.2,240); tone(390,0.1,'square',sfx,0,0.25,180); },
  hit:()=>{ tone(520,0.1,'square',sfx,0,0.4,220); noise(0.06,0.4); },
  spike:()=>{ noise(0.16,0.9); tone(700,0.14,'square',sfx,0,0.5,120); },
  jump:()=>tone(260,0.1,'triangle',sfx,0,0.4,420),
  sand:()=>noise(0.22,0.6),
  net:()=>tone(110,0.18,'sawtooth',sfx,0,0.35,70),
  grr:(n)=>{ if(!AC) return; tone(90+n*10,0.25+n*0.08,'sawtooth',sfx,0,0.25+n*0.08,55); },
  whistle:()=>{ if(!AC) return; const t=AC.currentTime; tone(2100,0.12,'square',sfx,t,0.22); tone(2100,0.3,'square',sfx,t+0.16,0.22,1900); },
  select:()=>tone(880,0.06,'square',sfx,0,0.3),
  move:()=>tone(660,0.04,'square',sfx,0,0.2),
  win:()=>seq([72,76,79,84,0,79,84,88],0.1,'square',0.35),
  pause:()=>seq([84,79,84],0.06,'square',0.3)
};
// música propia estilo reguetón (ritmo dembow), compuesta para el juego
const RG={bpm:94,
  chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],   // La m - Fa - Do - Sol
  bass:[45,41,36,43],
  kick:[0,4,8,12], snare:[3,6,11,14],
  lead:[ 76,0,0,74, 0,72,0,0, 74,0,76,0, 0,0,72,0,
         72,0,0,69, 0,72,0,0, 74,0,72,0, 69,0,0,0,
         67,0,0,69, 0,72,0,0, 72,0,74,0, 0,76,0,0,
         74,0,0,72, 0,71,0,0, 71,0,72,0, 74,0,0,0 ]};
const music={on:false,step:0,next:0,iv:null};
function playMusic(lead){ stopMusic(); if(!AC) return; music.on=true; music.step=lead?64:0; music.next=AC.currentTime+0.08; music.iv=setInterval(schedMusic,40); }
function stopMusic(){ if(music.iv) clearInterval(music.iv); music.iv=null; music.on=false; }
function drum(kind,t){
  if(!AC) return;
  if(kind==='k'){ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(42,t+0.16);
    g.gain.setValueAtTime(2.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.connect(g); g.connect(mus); o.start(t); o.stop(t+0.22); return; }
  const src=AC.createBufferSource(); src.buffer=noiseBuf; const f=AC.createBiquadFilter(), g=AC.createGain();
  if(kind==='s'){ f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.8; g.gain.setValueAtTime(1.6,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    const o=AC.createOscillator(), og=AC.createGain(); o.type='triangle'; o.frequency.setValueAtTime(230,t); og.gain.setValueAtTime(0.6,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.07); o.connect(og); og.connect(mus); o.start(t); o.stop(t+0.08); }
  else { f.type='highpass'; f.frequency.value=7000; g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); }
  src.connect(f); f.connect(g); g.connect(mus); src.start(t); src.stop(t+0.15);
}
function schedMusic(){
  if(!AC) return; const dt=60/RG.bpm/4;
  if(music.next<AC.currentTime-0.2) music.next=AC.currentTime+0.05;
  while(music.next<AC.currentTime+0.2){
    const t=music.next, st=music.step%64, b=st%16, bar=st>>4;
    if(RG.kick.includes(b)) drum('k',t);
    if(RG.snare.includes(b)) drum('s',t);
    if(b%2===0) drum('h',t);
    if(b===0||b===6||b===8||b===14){ tone(mtof(RG.bass[bar]),dt*1.6,'triangle',mus,t,1.1); }
    if(b===2||b===6||b===10||b===14){ for(const n of RG.chords[bar]) tone(mtof(n),dt*0.9,'square',mus,t,0.12); }
    const n=RG.lead[st]; if(n&&music.step>=64) tone(mtof(n),dt*1.8,'sawtooth',mus,t,0.16);
    music.next+=dt; music.step++;
  }
}

/* ================= CONTROLES (2 jugadores) ================= */
const BTN=['left','right','up','down','a','b','start'];
const mk=()=>{ const o={}; for(const k of BTN) o[k]=0; return o; };
const keys=[mk(),mk()], tch=mk(), bridge=[mk(),mk()], latch=[mk(),mk()];
const KM={KeyA:[0,'left'],KeyD:[0,'right'],KeyW:[0,'a'],KeyS:[0,'down'],Space:[0,'a'],KeyF:[0,'b'],KeyG:[0,'b'],ShiftLeft:[0,'b'],KeyP:[0,'start'],Escape:[0,'start'],
  ArrowLeft:[1,'left'],ArrowRight:[1,'right'],ArrowUp:[1,'a'],ArrowDown:[1,'down'],Enter:[1,'a'],NumpadEnter:[1,'a'],KeyK:[1,'a'],KeyL:[1,'b'],ShiftRight:[1,'b'],Numpad0:[1,'b']};
addEventListener('keydown',e=>{ const m=KM[e.code]; if(m){ if(padOpen) return; keys[m[0]][m[1]]=1; latch[m[0]][m[1]]=1;  e.preventDefault(); initAudio(); } });
addEventListener('keyup',e=>{ const m=KM[e.code]; if(m){ keys[m[0]][m[1]]=0; e.preventDefault(); } });
addEventListener('blur',()=>{ for(const s of [0,1]) for(const k of BTN){ keys[s][k]=0; bridge[s][k]=0; } });
// puente con la app Android: cada mando físico tiene su jugador
let padUsed=false;
function usePad(){ if(!padUsed){ padUsed=true; layout(); } }
window.kikoKey=(k,down,slot)=>{ const s=slot?1:0; if(k in bridge[s]){ bridge[s][k]=down?1:0; if(down) latch[s][k]=1; if(down){ initAudio(); usePad(); } } };

const ctl=document.getElementById('ctl'), dpad=document.getElementById('dpad'), kl=document.getElementById('kl'), kr=document.getElementById('kr'), bA=document.getElementById('bA'), bB=document.getElementById('bB'), pz=document.getElementById('pz');
let isTV=/[?&]tv=1/.test(location.search); try{ if(window.KikoApp&&KikoApp.isTV()) isTV=true; }catch(_){}
const isTouch=!isTV&&((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window));
const ptr=new Map();
const inApp=!!window.KikoApp;
let padOpen=false;
window.kikoNet=(n,ip)=>{ if(n>(G.net||0)){ G.pairT=150; try{ S.select(); }catch(_){} } G.net=n; G.ip=ip||''; };
function zoneAt(x,y){
  const d=dpad.getBoundingClientRect();
  if(x>=d.left-12&&x<=d.right+12&&y>=d.top-24&&y<=d.bottom+24) return x<d.left+d.width/2?'left':'right';
  for(const [el,z] of [[bA,'a'],[bB,'b']]){ const r=el.getBoundingClientRect(); if(x>=r.left-10&&x<=r.right+10&&y>=r.top-10&&y<=r.bottom+10) return z; }
  return null;
}
function syncT(){
  tch.left=tch.right=tch.a=tch.b=0; for(const z of ptr.values()) if(z) tch[z]=1;
  kl.classList.toggle('on',!!tch.left); kr.classList.toggle('on',!!tch.right); bA.classList.toggle('on',!!tch.a); bB.classList.toggle('on',!!tch.b);
}
ctl.addEventListener('pointerdown',e=>{ e.preventDefault(); initAudio(); try{ctl.setPointerCapture(e.pointerId);}catch(_){} ptr.set(e.pointerId,zoneAt(e.clientX,e.clientY)); syncT(); });
ctl.addEventListener('pointermove',e=>{ if(ptr.has(e.pointerId)){ ptr.set(e.pointerId,zoneAt(e.clientX,e.clientY)); syncT(); } });
const pUp=e=>{ ptr.delete(e.pointerId); syncT(); };
ctl.addEventListener('pointerup',pUp); ctl.addEventListener('pointercancel',pUp);
let tapAt=null;
cv.addEventListener('pointerdown',e=>{ initAudio(); const r=cv.getBoundingClientRect(); tapAt={x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}; });
pz.addEventListener('click',()=>{ initAudio(); togglePause(); });

function readPads(o){
  let gps=[]; try{ gps=navigator.getGamepads?navigator.getGamepads():[]; }catch(e){}
  let extra=0; const order=G.padOrder||[];
  for(const gp of gps){
    if(!gp) continue;
    const B=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    let sl=order.indexOf(gp.index);
    if(G.state==='pick'){ if(sl<0){ if(B(0)&&order.length<2){ order.push(gp.index); G.padOrder=order; sl=order.length-1; } else continue; } }
    else if(sl<0){ sl=Math.min(1,order.length+extra++); }
    const t=o[sl];
    const ax=gp.axes[0]||0, ay=gp.axes[1]||0;
    if(ax<-0.4||B(14)) t.left=1;
    if(ax>0.4||B(15)) t.right=1;
    if(ay<-0.5||B(12)) t.up=1;
    if(ay>0.5||B(13)) t.down=1;
    if(B(0)) t.a=1;
    if(B(1)||B(2)||B(3)||B(4)||B(5)) t.b=1;
    if(B(9)) t.start=1;
    if(t.a||t.start||t.b||t.left||t.right) { initAudio(); usePad(); }
  }
}
const inp=[{},{}], prev=[mk(),mk()];
function pollInput(){
  const o=[mk(),mk()];
  for(const s of [0,1]) for(const k of BTN){ o[s][k]=keys[s][k]||bridge[s][k]||latch[s][k]; latch[s][k]=0; }
  for(const k of BTN) o[0][k]=o[0][k]||tch[k];
  readPads(o);
  // con un solo jugador cualquier control mueve al jugador 1
  if(G.mode===1||G.state==='menu'||G.state==='over'){ for(const k of BTN) o[0][k]=o[0][k]||o[1][k]; }
  for(const s of [0,1]) for(const k of BTN){ inp[s][k+'P']=!!(o[s][k]&&!prev[s][k]); prev[s][k]=o[s][k]; inp[s][k]=!!o[s][k]; }
}

/* ================= ESTADO ================= */
const COUNTRY=[
  {name:'CUBA',  c:'#2a5fd0',d:'#14327a',hi:'#9cc0ff'},
  {name:'EUA',   c:'#f2f3f6',d:'#8a93a8',hi:'#ffffff'},
  {name:'CHINA', c:'#de2910',d:'#8a1508',hi:'#ff8a70'},
  {name:'ANGOLA',c:'#d0102f',d:'#6a0818',hi:'#ff7a8a',c2:'#1a1a1a'}];
const TEAM=[Object.assign({},COUNTRY[3]),Object.assign({},COUNTRY[0])];
function setTeams(){ for(const t of [0,1]) TEAM[t]=Object.assign({},COUNTRY[G.flag[t]]); }
const BALLR=13, BW=34, BH=42;          // bola del balón y tamaño del muñeco
const G=window.__V={state:'menu',mode:1,sel:0,flag:[3,0],score:[0,0],serve:0,touches:0,lastTeam:-1,timer:0,msg:'',msgC:'#fff',frame:0,paused:false,winner:-1,pred:NX,flash:0,netShake:0};
const ball=window.__VB={x:0,y:0,vx:0,vy:0,held:true,rot:0,trail:[]};
const players=[0,1].map(t=>({team:t,x:0,y:GY,vx:0,vy:0,on:true,cd:0,sq:0,face:t?-1:1}));
const dirOf=t=>t===0?1:-1;
const isHuman=t=>!G.demo&&(t===0||G.mode===2);

function startMatch(mode){ setTeams(); G.lose=[0,0]; G.lastW=''; G.lastL=''; G.bagW=[]; G.bagL=[]; for(const sl of [0,1]) for(const k of BTN){ bridge[sl][k]=0; }
  G.mode=mode; G.score=[0,0]; G.serve=0; G.winner=-1; G.paused=false; resetRally(); playMusic(); }
function resetRally(){
  for(const p of players){ const d=dirOf(p.team); p.x=NX-d*120; p.y=GY; p.vx=p.vy=0; p.on=true; p.cd=0; p.sq=0; }
  const s=players[G.serve]; s.x=NX-dirOf(G.serve)*150;
  ball.held=true; ball.vx=ball.vy=0; ball.trail=[]; ball.x=s.x; ball.y=GY-112;

}

/* ================= BALÓN ================= */
function predictLanding(){
  let x=ball.x, y=ball.y, vx=ball.vx, vy=ball.vy;
  for(let i=0;i<500;i++){
    vy+=GRAV; x+=vx; y+=vy;
    if(x<BALLR){x=BALLR;vx=Math.abs(vx)*0.9;} if(x>VW-BALLR){x=VW-BALLR;vx=-Math.abs(vx)*0.9;}
    if(y>NT&&Math.abs(x-NX)<BALLR+2){ vx=-vx*0.6; x=NX+Math.sign(x-NX||1)*(BALLR+3); }
    if(vy>0&&y>=GY-BH-BALLR) return x;
  }
  return x;
}
function point(win){
  if(G.state!=='play'&&G.state!=='serve') return;
  G.score[win]++; S.whistle();
  G.msg='PUNTO PARA '+TEAM[win].name; G.msgC=TEAM[win].hi;
  G.state='point'; G.timer=120; G.serve=win; G.lose[win]=0; G.lose[1-win]++; setMood(win);
}
const WIN_FX=['salto','baile','giro','atras','voltereta','risa','corazones','estrellas'];
const SAD_FX=['llanto','nube','derretido','cabizbajo','temblando'];
// saca de una bolsa sin repetir hasta usarlas todas, y nunca la misma dos veces seguidas
function fromBag(bagKey,lastKey,list){
  if(!G[bagKey]||!G[bagKey].length){ G[bagKey]=list.slice().sort(()=>Math.random()-0.5); if(G[bagKey][0]===G[lastKey]) G[bagKey].push(G[bagKey].shift()); }
  const v=G[bagKey].shift(); G[lastKey]=v; return v;
}
function setMood(win){
  G.win=win; G.moodT=0; G.parts=[];
  G.wType=fromBag('bagW','lastW',WIN_FX);
  const streak=(G.lose||[0,0])[1-win];
  G.anger=streak>=4?3:streak===3?2:streak===2?1:0;
  G.lType=G.anger===0?fromBag('bagL','lastL',SAD_FX):['','enfadado','rabieta','furia'][G.anger];
  const w=players[win];
  for(let i=0;i<40;i++) G.parts.push({k:'c',x:w.x,y:w.y-BH,vx:(Math.random()-0.5)*4,vy:-2-Math.random()*4,c:['#ffe070','#ff6a8a','#6ae0ff','#8aff6a','#ffffff'][i%5],t:0});
  if(G.anger>0) S.grr(G.anger);
}
const SWEAR=['GRR','#@!','%&#!','GRRR!','@#%&!','ARGH'];
function bubble(p,txt2){ G.parts.push({k:'w',x:p.x+p.face*14,y:p.y-BH-16,vx:0,vy:-0.25,txt:txt2,t:0}); }
function updMood(){
  const t=G.moodT=(G.moodT||0)+1;
  const w=players[G.win], l=players[1-G.win];
  // ganador
  if(G.wType==='risa'&&t%22===1) bubble(w,'JA JA');
  if(G.wType==='corazones'&&t%9===0) G.parts.push({k:'h',x:w.x+(Math.random()-0.5)*20,y:w.y-BH,vx:(Math.random()-0.5)*0.4,vy:-0.9,t:0});
  if(G.wType==='estrellas'&&t%34===0) for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; G.parts.push({k:'e',x:w.x,y:w.y-BH*0.5,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2-1,t:0}); }
  if((G.wType==='baile'||G.wType==='giro'||G.wType==='voltereta')&&t%30===0) S.jump();
  // perdedor
  const L=G.lType;
  if(L==='llanto'&&t%7===0) for(const k of [-1,1]) G.parts.push({k:'t',x:l.x+l.face*BW*0.12+k*BW*0.14,y:l.y-BH*0.6,vx:k*0.6,vy:-0.6,t:0});
  if(L==='nube'&&t%3===0) G.parts.push({k:'r',x:l.x+(Math.random()-0.5)*30,y:l.y-BH-34,vx:0,vy:3,t:0});
  if(L==='cabizbajo'&&t===20) bubble(l,'AY...');
  if(L==='temblando'&&t%16===0) G.parts.push({k:'t',x:l.x+(Math.random()-0.5)*16,y:l.y-BH*0.85,vx:(Math.random()-0.5),vy:-0.5,t:0});
  if(G.anger>=1&&t%(G.anger===1?50:G.anger===2?30:18)===5) bubble(l,SWEAR[Math.floor(Math.random()*SWEAR.length)]);
  if(G.anger>=2&&t%(G.anger===2?9:5)===0) for(const k of [-1,1]) G.parts.push({k:'v',x:l.x+k*10,y:l.y-BH-2,vx:k*0.5,vy:-1.2,t:0});
  if(G.anger>=2){ const per=G.anger===2?21:16; if(t%per===0){ S.sand(); for(let i=0;i<6;i++) G.parts.push({k:'d',x:l.x+(Math.random()-0.5)*20,y:GY-2,vx:(Math.random()-0.5)*3,vy:-1-Math.random()*2,t:0}); } }
  if(G.anger===3&&t%3===0) G.parts.push({k:'f',x:l.x+(Math.random()-0.5)*18,y:l.y-BH-4,vx:(Math.random()-0.5)*0.4,vy:-1.4,t:0});
  if(G.anger>=1&&t%40===0) S.grr(G.anger);
  for(const q of G.parts){ q.t++; q.x+=q.vx; q.y+=q.vy; if(q.k==='c'||q.k==='d') q.vy+=0.12; else if(q.k==='t') q.vy+=0.15; if(q.k==='c') q.vx*=0.98; }
  const life={c:110,r:14,t:40,w:44,h:70,e:40,v:30,d:30,f:22};
  G.parts=G.parts.filter(q=>q.t<(life[q.k]||40)&&q.y<GY+4);
}
function touch(p){
  if(G.lastTeam===p.team) G.touches++; else { G.touches=1; G.lastTeam=p.team; }
  if(G.touches>3){ G.msgWhy=1; point(1-p.team); G.msg='CUATRO TOQUES - '+G.msg; return false; }
  return true;
}
function collideBlob(p){
  // el muñeco son dos círculos: cuerpo y cabeza
  for(const [oy,r] of [[BH*0.38,BW*0.5],[BH*0.78,BW*0.36]]){
    const cx=p.x, cy=p.y-oy, dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy);
    if(d<r+BALLR){
      const nx=dx/(d||1), ny=dy/(d||1);
      ball.x=cx+nx*(r+BALLR+0.5); ball.y=cy+ny*(r+BALLR+0.5);
      if(p.cd===0){
        if(!touch(p)) return true;
        const sp=5.7+(p.on?0:0.5);
        ball.vx=nx*sp+p.vx*0.25; ball.vy=ny*sp+Math.min(0,p.vy)*0.25;
        if(ny>0.3&&!p.on){ S.spike(); G.flash=5; } else S.bump();
        p.cd=10;
        G.pred=predictLanding();
        for(const q of players) q.err=(Math.random()-0.5)*26;
      } else {
        const vn=ball.vx*nx+ball.vy*ny; if(vn<0){ ball.vx-=2*vn*nx; ball.vy-=2*vn*ny; }
      }
      return true;
    }
  }
  return false;
}
function updBall(){
  if(ball.held){ ball.y=GY-112+Math.sin(G.frame*0.08)*3; for(const p of players) if(collideBlob(p)){ ball.held=false; G.state='play'; } return; }
  ball.vy+=GRAV;
  const sp=Math.hypot(ball.vx,ball.vy); if(sp>7.4){ ball.vx*=7.4/sp; ball.vy*=7.4/sp; }
  ball.x+=ball.vx; ball.y+=ball.vy; ball.rot+=ball.vx*0.06;
  ball.trail.push([ball.x,ball.y]); if(ball.trail.length>6) ball.trail.shift();
  if(ball.x<BALLR){ ball.x=BALLR; ball.vx=Math.abs(ball.vx)*0.9; S.net(); }
  if(ball.x>VW-BALLR){ ball.x=VW-BALLR; ball.vx=-Math.abs(ball.vx)*0.9; S.net(); }
  if(ball.y<-300) ball.vy=Math.abs(ball.vy);
  const qx=clamp(ball.x,NX-3,NX+3), qy=clamp(ball.y,NT,GY);
  let nx=ball.x-qx, ny=ball.y-qy; const dd=Math.hypot(nx,ny);
  if(dd<BALLR){
    if(dd===0){ nx=ball.vx>0?-1:1; ny=0; } else { nx/=dd; ny/=dd; }
    ball.x=qx+nx*BALLR; ball.y=qy+ny*BALLR;
    const vn=ball.vx*nx+ball.vy*ny;
    if(vn<0){ ball.vx-=1.8*vn*nx; ball.vy-=1.8*vn*ny; S.net(); G.netShake=10; }
  }
  if(ball.y+BALLR>=GY){ ball.y=GY-BALLR; S.sand(); point(ball.x<NX?1:0); return; }
  for(const p of players) collideBlob(p);
  if(G.frame%6===0) G.pred=predictLanding();
}

/* ================= JUGADORES ================= */
function movePlayer(p,left,right,jump,maxV){
  const t=(right?1:0)-(left?1:0);
  p.vx=t*maxV;
  if(t) p.face=t;
  if(jump&&p.on){ p.vy=-7.2; p.on=false; S.jump(); }
  if(!p.on){ p.vy+=jump||p.vy>0?0.28:0.5; }
  p.y+=p.vy; p.x+=p.vx;
  if(p.y>=GY){ if(!p.on) p.sq=8; p.y=GY; p.vy=0; p.on=true; }
  const [a,b]=p.team===0?[BW/2,NX-4-BW/2]:[NX+4+BW/2,VW-BW/2];
  p.x=clamp(p.x,a,b);
  if(p.cd>0) p.cd--; if(p.sq>0) p.sq--;
}
function aiControl(p){
  const d=dirOf(p.team);
  let tx=NX-d*110, jump=false;
  if(G.state==='serve'&&G.serve===p.team){
    tx=ball.x-d*8; if(G.timer>60&&Math.abs(p.x-tx)<5&&p.on) jump=true;
  } else if(G.state==='play'){
    const ours=p.team===0?G.pred<NX:G.pred>NX;
    if(ours){
      const third=G.lastTeam===p.team&&G.touches>=2;
      const off=third?14:(Math.abs(G.pred-NX)<60?16:9);
      tx=G.pred-d*off+(p.err||0);
      const near=Math.abs(ball.x-p.x)<38, above=ball.y<p.y-BH-6&&ball.y>p.y-BH-110;
      if(near&&above&&ball.vy>-2&&(Math.abs(p.x-NX)<110||third)&&Math.random()<0.25) jump=true;
    } else tx=NX-d*120;
  }
  if(jump) p.hold=true; if(p.on&&!jump) p.hold=false; if(p.vy>=0&&!p.on) p.hold=false;
  const dx=tx-p.x;
  movePlayer(p,dx<-3,dx>3,jump||p.hold,Math.abs(dx)<10?1.4:2.6);
}

/* ================= BUCLE ================= */
function togglePause(){
  if(G.state!=='play'&&G.state!=='serve'&&G.state!=='point') return;
  G.paused=!G.paused; S.pause();
  if(G.paused) stopMusic(); else playMusic();
}
window.kikoPause=()=>{ if(!G.paused&&(G.state==='play'||G.state==='serve'||G.state==='point')) togglePause(); };
window.kikoBack=()=>{ if(G.state==='menu') return false; if(G.state==='pick'){ try{ KikoApp.endPick(); }catch(_){} G.state='menu'; return true; } if(!G.paused&&G.state!=='over'){ togglePause(); return true; } G.paused=false; G.state='menu'; stopMusic(); return true; };
document.addEventListener('visibilitychange',()=>{ if(document.hidden) window.kikoPause(); });

function update(){
  G.frame++; pollInput();
  if(G.flash>0) G.flash--; if(G.netShake>0) G.netShake--;
  const s0=inp[0];
  switch(G.state){
    case 'menu':
      if(AC&&AC.state==='running'&&!music.on&&!padOpen) playMusic(true);
      { // filas: 0 modo, 1 bandera izquierda, 2 bandera derecha, 3 jugar
        const NR=canPad?5:4;
        if(s0.upP){ G.sel=(G.sel+NR-1)%NR; S.move(); }
        if(s0.downP||s0.bP){ G.sel=(G.sel+1)%NR; S.move(); }
        let dh=G.sel<3?(s0.rightP?1:0)-(s0.leftP?1:0):0, go=(s0.startP||s0.aP)&&G.sel===3;
        if(s0.aP&&G.sel<3){ dh=1; }
        if(tapAt){ const row=Math.floor((tapAt.y-118)/22); if(row>=0&&row<(canPad?5:4)){ G.sel=row; if(row===3) go=true; else if(row===4){ openPad(); break; } else dh=tapAt.x<VW/2?-1:1; } }
        if(G.sel===4&&(s0.aP||s0.startP)){ openPad(); break; }
        if(dh&&G.sel<3){ S.move(); if(G.sel===0) G.mode=G.mode===1?2:1; else if(G.sel<3){ const t=G.sel-1; G.flag[t]=(G.flag[t]+dh+4)%4; } }
        if(go){ initAudio(); S.select();
          if(G.mode===2){ G.state='pick'; G.pickStep=0; G.padOrder=[]; for(const sl of [0,1]) for(const k of BTN){ bridge[sl][k]=0; latch[sl][k]=0; }
            try{ if(window.KikoApp&&KikoApp.resetPlayers) KikoApp.resetPlayers(); }catch(_){} }
          else startMatch(1); }
      }
      break;
    case 'serve': case 'play': case 'point':
      if(inp[0].startP||inp[1].startP) togglePause();
      if(G.paused) break;
      for(const p of players){
        if(G.state==='point'){ movePlayer(p,false,false,false,0); continue; }
        if(isHuman(p.team)){ const s=inp[p.team]; movePlayer(p,s.left,s.right,s.a||s.b||s.up,3.0); }
        else aiControl(p);
      }
      if(G.state==='serve'){ G.timer++; updBall(); }
      else if(G.state==='play') updBall();
      else if((updMood(),--G.timer<=0)){
        const [a,b]=G.score;
        if((a>=15||b>=15)&&Math.abs(a-b)>=2){ G.winner=a>b?0:1; G.state='over'; G.timer=60; stopMusic(); S.win(); setMood(G.winner); }
        else resetRally();
      }
      break;
    case 'pick':
      if(G.pickStep===0&&inp[0].aP){ G.pickStep=1; S.select(); }
      else if(G.pickStep===1&&inp[1].aP){ G.pickStep=2; S.select(); G.timer=40; }
      else if(G.pickStep===2&&--G.timer<=0){ try{ if(window.KikoApp&&KikoApp.endPick) KikoApp.endPick(); }catch(_){} startMatch(2); }
      if(tapAt&&G.pickStep<2){ G.pickStep++; S.select(); if(G.pickStep===2) G.timer=40; }
      break;
    case 'over':
      updMood(); if(G.moodT%90===0){ const w=players[G.win]; for(let i=0;i<30;i++) G.parts.push({k:'c',x:w.x,y:w.y-BH,vx:(Math.random()-0.5)*4,vy:-2-Math.random()*4,c:['#ffe070','#ff6a8a','#6ae0ff','#8aff6a'][i%4],t:0}); }
      if(G.timer>0) G.timer--; else if(s0.aP||s0.startP||tapAt){ G.state='menu'; }
      break;
  }
  tapAt=null;
}

const hash=(x,y)=>(((x*73856093)^(y*19349663))>>>0);

const flagCache={};
function star(c,x,y,r,rot){ c.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r*0.4:r, a=rot-Math.PI/2+i*Math.PI/5; c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } c.closePath(); c.fill(); }
function flagImg(i){

  if(!bgCanvas||bgCanvas.sc!==SC) buildBG();
  ctx.drawImage(bgCanvas,0,0,VW,VH); drawNet();
  R(VW/2-200,30,400,190,'rgba(6,18,28,0.88)');
  txt('ELIGE LOS MANDOS',VW/2,42,'#ffe070','center',14);
  for(const t of [0,1]){
    const cx=t===0?VW/2-100:VW/2+100, done=G.pickStep>t, now=G.pickStep===t;
    const p={team:t,x:cx,y:150,vx:0,vy:0,on:true,sq:0,face:t?-1:1,noSh:true};
    drawPlayer(p);
    drawFlag(G.flag[t],cx-14,162,28,18,false);
    txt(t===0?'IZQUIERDA':'DERECHA',cx,186,'#9ccaff','center',9);
    txt(done?'LISTO':now?'PULSA A EN SU MANDO':'ESPERANDO...',cx,200,done?'#8aff6a':now&&(G.frame>>4)%2?'#ffffff':'#ffe070','center',8);
  }
  txt('VALE CUALQUIER MANDO: BLUETOOTH, EL CONTROL DE LA TELE O EL MOVIL',VW/2,226,'#ffffff','center',6);
  txt('ATRAS PARA VOLVER',VW/2,238,'#ffffff','center',6);
}
function drawOver(){
  drawGame();
  R(0,90,VW,90,'rgba(6,18,28,0.85)');
  txt('GANA '+TEAM[G.winner].name,VW/2,104,TEAM[G.winner].hi,'center',16);
  txt(pad(G.score[0],2)+' - '+pad(G.score[1],2),VW/2,132,'#ffffff','center',16); drawFlag(G.flag[G.winner],VW/2-30,60,60,40,true);
  if(G.timer<=0&&(G.frame>>5)%2===0) txt('PULSA A PARA VOLVER AL MENU',VW/2,160,'#ffffff','center',8);
}
function draw(){
  ctx.setTransform(SC,0,0,SC,0,0);
  if(G.state==='menu') drawMenu(); else if(G.state==='over') drawOver(); else if(G.state==='pick') drawPick(); else drawGame();
  if(G.pairT>0){ G.pairT--; const ty2=G.state==='menu'?2:38; R(VW/2-110,ty2,220,22,'rgba(20,90,40,0.94)'); txt('MANDO EMPAREJADO ('+G.net+')',VW/2,ty2+7,'#ffffff','center',8); }
  txt(VERSION,VW-4,G.state==='menu'||G.state==='pick'?VH-12:3,'rgba(255,255,255,0.8)','right',6);
}

/* ================= MÓVIL COMO MANDO ================= */
const canPad=inApp&&!isTV&&isTouch;
const padEl=document.getElementById('pad'), padSt=document.getElementById('padst'), padIp=document.getElementById('padip');
function openPad(){
  padOpen=true; stopMusic(); padEl.hidden=false; document.getElementById('wrap').hidden=true;
  padSt.textContent='Buscando la tele en tu Wi-Fi...'; padIp.parentNode.hidden=true;
  try{ KikoApp.ctrlStart(''); }catch(_){}
  setTilt(tiltOn);
}
function closePad(){ setDir(0); try{ KikoApp.setPortrait(false); }catch(_){} padOpen=false; try{ KikoApp.ctrlStop(); }catch(_){} padEl.hidden=true; document.getElementById('wrap').hidden=false; G.sel=0; layout(); }
window.kikoCtrl=(m)=>{
  if(m.startsWith('OK:')){ padSt.textContent='Conectado a la tele ('+m.slice(3)+')'; padSt.className='ok'; padIp.parentNode.hidden=true; }
  else if(m.startsWith('ERR:')){ padSt.textContent=m.slice(4); padSt.className='err'; padIp.parentNode.hidden=false; }
  else { padSt.textContent=m; padSt.className=''; }
};
document.querySelectorAll('#pad [data-k]').forEach(el=>{
  const k=el.dataset.k;
  const down=e=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} el.classList.add('on'); try{ KikoApp.ctrlSend(k,true); }catch(_){} try{ navigator.vibrate&&navigator.vibrate(12); }catch(_){} };
  const up=e=>{ if(!el.classList.contains('on')) return; el.classList.remove('on'); try{ KikoApp.ctrlSend(k,false); }catch(_){} };
  el.addEventListener('pointerdown',down); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up);
});
document.getElementById('padexit').addEventListener('click',closePad);
document.getElementById('padpair').addEventListener('click',()=>{ padSt.textContent='Buscando la tele en tu Wi-Fi...'; padSt.className=''; padIp.parentNode.hidden=true; try{ KikoApp.ctrlStart(''); }catch(_){} });
document.getElementById('padgo').addEventListener('click',()=>{ const ip=padIp.value.trim(); if(!ip) return; padSt.textContent='Conectando a '+ip+'...'; padSt.className=''; try{ KikoApp.ctrlStart(ip); }catch(_){} });
// inclinar el móvil para moverse (móvil en vertical)
let tiltOn=true, tiltZero=0, lastG=0, tiltDir=0;
const tzl=document.getElementById('tzl'), tzr=document.getElementById('tzr'), tdot=document.getElementById('tiltdot');
function ctrl(k,d){ try{ KikoApp.ctrlSend(k,d); }catch(_){} }
function setDir(d){
  if(d===tiltDir) return;
  if(tiltDir<0) ctrl('left',false); if(tiltDir>0) ctrl('right',false);
  tiltDir=d;
  if(d<0) ctrl('left',true); if(d>0) ctrl('right',true);
  tzl.classList.toggle('on',d<0); tzr.classList.toggle('on',d>0);
  if(d){ try{ navigator.vibrate&&navigator.vibrate(8); }catch(_){} }
}
addEventListener('deviceorientation',e=>{
  if(e.gamma==null) return; lastG=e.gamma;
  if(!padOpen||!tiltOn) return;
  const g=clamp(e.gamma-tiltZero,-45,45), th=9;
  tdot.style.setProperty('--g',(g/45*45).toFixed(1));
  let d=tiltDir; if(g<-th) d=-1; else if(g>th) d=1; else if(Math.abs(g)<th*0.55) d=0;
  setDir(d);
});
function setTilt(on){
  tiltOn=on; setDir(0);
  document.getElementById('tilt').hidden=!on; document.getElementById('padmain').hidden=on;
  document.getElementById('padmode').textContent=on?'BOTONES':'INCLINAR';
  try{ KikoApp.setPortrait(on); }catch(_){}
}
document.getElementById('padmode').addEventListener('click',()=>setTilt(!tiltOn));
document.getElementById('tiltzero').addEventListener('click',()=>{ tiltZero=lastG; setDir(0); });
const kb0=window.kikoBack; window.kikoBack=()=>{ if(padOpen){ closePad(); return true; } return kb0(); };

/* ================= PANTALLA ================= */
function layout(){
  const wrap=document.getElementById('wrap');
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const portrait=H>W, showT=isTouch&&!padUsed;
  ctl.hidden=!showT; pz.hidden=!showT;
  let ctlH=0;
  if(showT){ ctl.className=portrait?'port':'land'; if(portrait) ctlH=150; }
  const s=Math.max(0.5,Math.min(W/VW,(H-ctlH)/VH));
  cv.style.width=Math.floor(VW*s)+'px'; cv.style.height=Math.floor(VH*s)+'px';
  const ns=clamp(Math.ceil(s*(window.devicePixelRatio||1)),1,4);
  if(ns!==SC){ SC=ns; cv.width=VW*SC; cv.height=VH*SC; }
}
addEventListener('resize',layout); layout();

let last=performance.now(), acc=0;
function loop(now){
  acc+=Math.min(100,now-last); last=now;
  let n=0; while(acc>=1000/60&&n<5){ update(); acc-=1000/60; n++; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(inApp){ try{ initAudio(); }catch(_){} }
})();
</script>
